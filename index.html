<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LizzyOS 💗</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

    <section id="landing" class="screen active">
        <div class="heroCard">
            <div class="heroLogo">💗</div>
            <p class="eyebrow">WELCOME TO</p>
            <h1>LizzyOS</h1>
            <p>A tiny pink operating system made for one very specific person.</p>
            <button id="enterButton">Enter LizzyOS ✨</button>
        </div>
    </section>

    <section id="desktop" class="screen">
        <div class="desktopBackdrop"></div>

        <div class="topBar">
            <div class="brand">🍓 LizzyOS</div>
            <div class="topStatus">
                <span id="currentPersona">🕵️ Agent Yelizaveta</span>
                <span id="liveClock"></span>
            </div>
        </div>

        <div id="desktopGrid" class="desktopGrid">
            <button class="desktopIcon" data-app="archives">
                <span class="iconEmoji">📁</span><span>Lizzy Archives</span>
            </button>
            <button class="desktopIcon" data-app="mission">
                <span class="iconEmoji">🗂️</span><span>Mission Log</span>
            </button>
            <button class="desktopIcon" data-app="readme">
                <span class="iconEmoji">💗</span><span>Read Me</span>
            </button>
            <button class="desktopIcon" data-app="openwhen">
                <span class="iconEmoji">💌</span><span>Open When...</span>
            </button>
            <button class="desktopIcon" data-app="lizzyquiz">
                <span class="iconEmoji">🧠</span><span>Lizzy Quiz</span>
            </button>
            <button class="desktopIcon" data-app="heartcatch">
                <span class="iconEmoji">💖</span><span>Heart Catch</span>
            </button>
            <button class="desktopIcon" data-app="mikhailquiz">
                <span class="iconEmoji">🧠</span><span>Mikhail Quiz</span>
            </button>
            <button class="desktopIcon" data-app="mystery">
                <span class="iconEmoji">🎁</span><span>Daily Mystery</span>
            </button>
            <button class="desktopIcon" data-app="calendar">
                <span class="folderIcon">📁<b>📅</b></span><span>Our Date</span>
            </button>
            <button class="desktopIcon" data-app="recycle">
                <span class="iconEmoji">🗑️</span><span>Recycle Bin</span>
            </button>
            <button class="desktopIcon" data-app="personality">
                <span class="iconEmoji">🎭</span><span>Personality</span>
            </button>
            <button class="desktopIcon" data-app="mail">
                <span class="iconEmoji">💌</span><span>Lizzy Mail</span>
            </button>
        </div>

        <div class="taskbar">
            <button id="homeButton">🍓</button>
            <span id="taskbarMood">💗 LizzyOS Online</span>
            <button id="soundToggle">🔊</button>
        </div>
    </section>

    <div id="windowLayer" class="windowLayer hidden"></div>
</div>

<template id="windowTemplate">
    <div class="appWindow">
        <div class="windowHeader">
            <div class="trafficLights">
                <button class="traffic red" data-window-action="close"></button>
                <button class="traffic yellow" data-window-action="minimize"></button>
                <button class="traffic green" data-window-action="maximize"></button>
            </div>
            <h2 class="windowTitle"></h2>
        </div>
        <div class="windowBody"></div>
        <button class="windowBottomClose" data-window-action="close">Close</button>
    </div>
</template>

<script src="script.js"></script>
</body>
</html>
